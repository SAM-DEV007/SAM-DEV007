<svg width="1200" height="28" viewBox="0 0 1200 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jedi-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="jedi-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="jedi-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hilt-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <style>
      @keyframes sith-unstable-surge {
        0%   { opacity: 0.4; }
        12%  { opacity: 0.95; }
        18%  { opacity: 0.6; }
        35%  { opacity: 1; }
        48%  { opacity: 0.55; }
        62%  { opacity: 0.9; }
        78%  { opacity: 0.7; }
        88%  { opacity: 1; }
        100% { opacity: 0.4; }
      }

      @keyframes sith-crackle {
        0%, 100% { opacity: 0.85; }
        25%      { opacity: 1; }
        50%      { opacity: 0.7; }
        75%      { opacity: 0.95; }
      }

      .jedi-aura {
        animation: sith-unstable-surge 1.25s infinite;
      }
      .jedi-mid-plasma {
        animation: sith-unstable-surge 0.95s infinite reverse;
      }
      .jedi-core {
        animation: sith-crackle 0.4s steps(2, start) infinite;
      }
      .jedi-emitter {
        animation: sith-unstable-surge 0.7s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <rect x="10" y="10" width="10" height="8" rx="1.5" fill="#1E293B"/>
  <rect x="20" y="9" width="47" height="10" rx="1" fill="url(#hilt-metal)"/>
  <line x1="28" y1="9" x2="28" y2="19" stroke="#0F172A" stroke-width="2"/>
  <line x1="34" y1="9" x2="34" y2="19" stroke="#0F172A" stroke-width="2"/>
  <line x1="40" y1="9" x2="40" y2="19" stroke="#0F172A" stroke-width="2"/>
  <rect x="50" y="7.5" width="5" height="2" rx="0.5" fill="#38BDF8"/>
  <rect x="67" y="8" width="6" height="12" rx="0.5" fill="#475569"/>
  <polygon points="73,7 84,10.5 84,17.5 73,21" fill="url(#hilt-metal)"/>

  <rect class="jedi-aura" x="80" y="1" width="1110" height="26" rx="13" fill="url(#jedi-outer)"/>
  <rect class="jedi-mid-plasma" x="81" y="7" width="1108" height="14" rx="7" fill="url(#jedi-inner)"/>
  <rect x="82" y="10.5" width="1106" height="7" rx="3.5" fill="#BAE6FD" opacity="0.95"/>
  <rect class="jedi-core" x="82" y="12" width="1104" height="4" rx="2" fill="#FFFFFF"/>
  <circle class="jedi-emitter" cx="82" cy="14" r="13" fill="url(#jedi-flare)"/>
</svg>
