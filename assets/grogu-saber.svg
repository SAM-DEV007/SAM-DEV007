<svg width="1200" height="50" viewBox="0 0 1200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grogu-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="grogu-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#05DF72" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="grogu-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="chrome-ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <radialGradient id="force-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shoto-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <style>
      @keyframes grogu-idle {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-2px); }
      }

      @keyframes ball-levitate {
        0%, 100% { transform: translateY(0px) scale(1); }
        50%      { transform: translateY(-3.5px) scale(1.05); }
      }

      @keyframes grogu-ignite {
        0%   { transform: scaleX(0); opacity: 0.2; }
        25%  { opacity: 1; }
        100% { transform: scaleX(1); opacity: 1; }
      }

      @keyframes grogu-pulse {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 0.95; }
      }

      @keyframes grogu-core-hum {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.82; }
      }

      .grogu-character {
        animation: grogu-idle 3s ease-in-out infinite;
        transform-origin: 50px 25px;
      }

      .force-orb {
        animation: ball-levitate 2.4s ease-in-out infinite;
        transform-origin: 108px 25px;
      }

      .blade-igniter {
        transform-origin: 145px 25px;
        transform-box: view-box;
        animation: grogu-ignite 0.55s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      }

      .emerald-aura {
        animation: grogu-pulse 2s ease-in-out infinite 0.55s;
      }

      .emerald-core {
        animation: grogu-core-hum 1.2s ease-in-out infinite alternate 0.55s;
      }
    </style>
  </defs>

  <g class="grogu-character">
    <path d="M 40 22 C 28 20, 12 18, 4 23 C 12 28, 28 28, 40 26 Z" fill="#86EFAC"/>
    <path d="M 38 23 C 28 21, 16 20, 9 23 C 16 26, 28 26, 38 25 Z" fill="#FDA4AF" opacity="0.85"/>

    <path d="M 64 22 C 76 20, 92 18, 100 23 C 92 28, 76 28, 64 26 Z" fill="#86EFAC"/>
    <path d="M 66 23 C 76 21, 88 20, 95 23 C 88 26, 76 26, 66 25 Z" fill="#FDA4AF" opacity="0.85"/>

    <rect x="34" y="31" width="36" height="15" rx="6" fill="#D4B996"/>
    <ellipse cx="52" cy="33" rx="16" ry="4" fill="#C2A278"/>

    <ellipse cx="52" cy="23" rx="16" ry="12" fill="#86EFAC"/>
    <path d="M 47 15 Q 52 14 57 15" stroke="#4ADE80" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M 48 18 Q 52 17 56 18" stroke="#4ADE80" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <ellipse cx="44" cy="22" rx="4.5" ry="5" fill="#0F172A"/>
    <circle cx="45.5" cy="20" r="1.5" fill="#FFFFFF"/>
    <circle cx="43" cy="23.5" r="0.8" fill="#FFFFFF" opacity="0.6"/>

    <ellipse cx="60" cy="22" rx="4.5" ry="5" fill="#0F172A"/>
    <circle cx="61.5" cy="20" r="1.5" fill="#FFFFFF"/>
    <circle cx="59" cy="23.5" r="0.8" fill="#FFFFFF" opacity="0.6"/>

    <ellipse cx="52" cy="25.5" rx="1.2" ry="0.8" fill="#4ADE80"/>
    <path d="M 50 28 Q 52 29.5 54 28" stroke="#15803D" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <path d="M 68 33 C 75 32, 80 30, 84 28 C 82 27, 78 28, 70 31 Z" fill="#86EFAC"/>
    <circle cx="83.5" cy="28.5" r="1.2" fill="#4ADE80"/>
    <circle cx="84" cy="27" r="1.2" fill="#4ADE80"/>
  </g>

  <g class="force-orb">
    <circle cx="104" cy="25" r="14" fill="url(#force-glow)"/>
    <circle cx="104" cy="25" r="8" stroke="#6EE7B7" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
    <circle cx="104" cy="25" r="5.5" fill="url(#chrome-ball)"/>
  </g>

  <g>
    <rect x="120" y="22" width="6" height="6" rx="1" fill="#0F172A"/>
    <rect x="126" y="21" width="18" height="8" rx="1" fill="url(#shoto-metal)"/>
    <line x1="129" y1="21" x2="129" y2="29" stroke="#000000" stroke-width="1"/>
    <line x1="133" y1="21" x2="133" y2="29" stroke="#000000" stroke-width="1"/>
    <line x1="137" y1="21" x2="137" y2="29" stroke="#000000" stroke-width="1"/>
    <rect x="135" y="19.8" width="3" height="1.2" rx="0.4" fill="#10B981"/>
    <polygon points="144,20 148,22.5 148,27.5 144,30" fill="#334155"/>
  </g>

  <g class="blade-igniter">
    <rect class="emerald-aura" x="146" y="12" width="1046" height="26" rx="13" fill="url(#grogu-outer)"/>
    <rect x="147" y="18" width="1045" height="14" rx="7" fill="url(#grogu-inner)"/>
    <rect x="148" y="21.5" width="1043" height="7" rx="3.5" fill="#A7F3D0" opacity="0.95"/>
    <rect class="emerald-core" x="148" y="23" width="1042" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <circle cx="147" cy="25" r="13" fill="url(#grogu-flare)"/>
</svg>
